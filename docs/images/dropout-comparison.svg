<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Dropout에 따른 best validation loss</title>
  <desc id="desc">dropout 0.1은 5.699, 0.2는 5.793, 0.3은 5.900을 기록했다</desc>
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="48" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#111827">Best Validation Loss by Dropout</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="120" y1="110" x2="920" y2="110"/>
    <line x1="120" y1="190" x2="920" y2="190"/>
    <line x1="120" y1="270" x2="920" y2="270"/>
    <line x1="120" y1="350" x2="920" y2="350"/>
  </g>
  <g fill="#4b5563" font-family="Arial, Noto Sans KR, sans-serif" font-size="18">
    <text x="102" y="116" text-anchor="end">5.95</text>
    <text x="102" y="196" text-anchor="end">5.85</text>
    <text x="102" y="276" text-anchor="end">5.75</text>
    <text x="102" y="356" text-anchor="end">5.65</text>
    <text transform="translate(230 400)" text-anchor="middle">0.1</text>
    <text transform="translate(520 400)" text-anchor="middle">0.2</text>
    <text transform="translate(810 400)" text-anchor="middle">0.3</text>
    <text x="34" y="225" text-anchor="middle" transform="rotate(-90 34 225)">best validation loss</text>
    <text transform="translate(520 438)" text-anchor="middle">dropout</text>
  </g>
  <polyline points="230,311 520,236 810,150" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#dc2626">
    <circle cx="230" cy="311" r="10"/>
    <circle cx="520" cy="236" r="10"/>
    <circle cx="810" cy="150" r="10"/>
  </g>
  <g fill="#111827" font-family="Arial, Noto Sans KR, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="230" y="293">5.699</text>
    <text x="520" y="218">5.793</text>
    <text x="810" y="132">5.900</text>
  </g>
</svg>
